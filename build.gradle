plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://jitpack.io' }
    mavenCentral()
}

sourceSets {
    // compile-only API stubs for optional integrations (Mod Menu, Iris, ImmediatelyFast); never shipped
    stubs {
        compileClasspath += main.compileClasspath
    }
    main {
        compileClasspath += stubs.output
    }
}

loom {
    accessWidenerPath = file("src/main/resources/figura.classtweaker")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

    // Fabric API modules Figura uses (bundled as jar-in-jar)
    include(implementation(fabricApi.module("fabric-api-base", project.fabric_api)))
    include(implementation(fabricApi.module("fabric-command-api-v2", project.fabric_api)))
    include(implementation(fabricApi.module("fabric-key-mapping-api-v1", project.fabric_api)))
    include(implementation(fabricApi.module("fabric-resource-loader-v0", project.fabric_api)))
    include(implementation(fabricApi.module("fabric-resource-loader-v1", project.fabric_api)))

    // Libraries
    include(implementation("com.github.FiguraMC.luaj:luaj-core:${project.luaj}-figura"))
    include(implementation("com.github.FiguraMC.luaj:luaj-jse:${project.luaj}-figura"))
    include(implementation("com.neovisionaries:nv-websocket-client:${project.nv_websocket}"))
}

processResources {
    def props = [
            version          : project.version,
            java_version     : project.java_version,
            minecraft_version: project.minecraft_version,
            assets_version   : project.assets_version
    ]
    inputs.properties props
    filesMatching("fabric.mod.json") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = Integer.parseInt(project.java_version)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
    }
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
}

jar {
    from("LICENSE.md") {
        rename { "FIGURA_${it}" }
    }
}
